<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 240px;
      padding: 15px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      background-color: #f8f9fa;
      margin: 0;
    }
    h3 {
      margin: 0 0 10px 0;
      font-size: 16px;
      color: #1a73e8;
    }
    p {
      font-size: 12px;
      color: #555;
      margin-bottom: 15px;
      line-height: 1.4;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #1a73e8;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #1557b0;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      font-weight: 600;
      color: #188038;
    }
  </style>
</head>
<body>
  <h3>Auto Marks Filler</h3>
  <p>পেজের ফুল মার্কস (20 বা 10) অটোমেটিক ডিটেক্ট করে ১০ জন করে ব্যাচে নম্বর বসাবে।</p>
  <button id="fillBtn">Fill Marks Now</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
